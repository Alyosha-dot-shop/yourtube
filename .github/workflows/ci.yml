# Build and test YourTube on Linux, macOS and Windows on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    # Arch ships the newest GTK and libadwaita, which YourTube needs (GTK 4.20+, libadwaita 1.8+).
    container: archlinux:latest
    steps:
      - name: Install GTK, libadwaita, Rust, mpv and yt-dlp
        run: pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita rust mpv yt-dlp
      - uses: actions/checkout@v7
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: yourtube-linux-x86_64
          path: target/release/yourtube

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and libadwaita
        run: brew install gtk4 libadwaita pkgconf mpv yt-dlp
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: yourtube-macos
          path: target/release/yourtube

  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: yourtube-windows-x86_64
          path: target/release/yourtube.exe
