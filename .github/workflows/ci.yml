# Build and test YourTube on Linux, macOS and Windows on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # the release workflow builds through this one
  schedule:
    - cron: "17 6 * * 1" # weekly, so new advisories against the locked crates show up

# Read-only by default; nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  deny:
    name: Dependencies (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  linux:
    name: Linux (Arch)
    runs-on: ubuntu-latest
    # Arch ships the newest GTK and libadwaita, which YourTube needs (GTK 4.20+, libadwaita 1.8+).
    container: archlinux@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0 # latest, 2026-10-21; pacman -Syu below updates the packages
    steps:
      - name: Install GTK, libadwaita, Rust, mpv and yt-dlp
        run: pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita rust mpv yt-dlp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yourtube-linux-x86_64
          path: target/release/yourtube

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK and libadwaita
        run: brew install gtk4 libadwaita pkgconf mpv yt-dlp
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yourtube-macos
          path: target/release/yourtube

  windows:
    name: Windows (MSYS2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            zip
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      # A folder that runs on a PC without MSYS2: the program, the GTK DLLs it loads, and the
      # data GTK needs (settings schemas, icons).
      - name: Bundle for download
        run: |
          d=dist/YourTube
          mkdir -p $d/share/glib-2.0/schemas $d/share/icons
          cp target/release/yourtube.exe $d/
          ldd $d/yourtube.exe | awk '/ucrt64/ {print $3}' | sort -u | xargs -I{} cp {} $d/
          cp /ucrt64/share/glib-2.0/schemas/gschemas.compiled $d/share/glib-2.0/schemas/
          cp -r /ucrt64/share/icons/Adwaita /ucrt64/share/icons/hicolor $d/share/icons/
          cp README.md LICENSE $d/
          (cd dist && zip -qr ../yourtube-windows-x86_64.zip YourTube)
          ls -la yourtube-windows-x86_64.zip
      # Start the bundled program outside MSYS2, with only Windows itself on PATH: a missing
      # DLL fails here instead of on someone's PC.
      - name: Check the bundle starts on plain Windows
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $out = & "dist\YourTube\yourtube.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "yourtube.exe --help failed with $LASTEXITCODE" }
          $out | Select-Object -First 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yourtube-windows-x86_64
          path: yourtube-windows-x86_64.zip
