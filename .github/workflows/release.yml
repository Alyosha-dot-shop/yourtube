# Tag a version (git tag v0.2.0 && git push --tags) to publish it: the CI builds all three
# platforms, then this attaches the programs to a GitHub release with their SHA-256 sums and a
# signed record of how they were built. Check a download with:
#   gh attestation verify yourtube-linux-x86_64 --repo Alyosha-dot-shop/yourtube
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  # The Flatpak, with mpv, yt-dlp and Deno inside (takes a while: it builds mpv and FFmpeg).
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: yourtube-linux-x86_64.flatpak
          artifact-name: yourtube-flatpak
          manifest-path: packaging/flatpak/io.github.yourtube.YourTube.yml
          cache-key: flatpak-builder-${{ github.sha }}

  publish:
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Name the files and write SHA256SUMS
        run: |
          mkdir dist
          cp artifacts/yourtube-linux-x86_64/yourtube dist/yourtube-linux-x86_64
          cp artifacts/yourtube-macos/yourtube dist/yourtube-macos
          cp artifacts/yourtube-windows-x86_64/yourtube-windows-x86_64.zip dist/
          cp artifacts/yourtube-flatpak/yourtube-linux-x86_64.flatpak dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/yourtube-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "YourTube $TAG" --generate-notes
