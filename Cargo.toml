[package]
name = "yourtube"
version = "0.1.0"
edition = "2024"
description = "A YouTube app that keeps your history and recommendations on your own computer"
license = "GPL-3.0-or-later"
repository = "https://github.com/Alyosha-dot-shop/yourtube"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
dirs = "7.0.0"
getrandom = "0.2"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
quick-xml = "0.42.0"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
ureq = { version = "3.5.0", features = ["socks-proxy"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
